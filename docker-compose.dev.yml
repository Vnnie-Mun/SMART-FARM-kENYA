version: '3.8'

services:
  arduino-sensor-processor-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: arduino-sensor-processor-dev
    restart: unless-stopped
    
    # Environment variables
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DEBUG=True
    
    # Port mapping
    ports:
      - "${FLASK_PORT:-5000}:5000"
    
    # Serial port access (Linux/Mac)
    devices:
      - "${SERIAL_PORT:-/dev/ttyUSB0}:${SERIAL_PORT:-/dev/ttyUSB0}"
    
    # Volume mounts for hot reload
    volumes:
      - .:/app
      - ./logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      # Exclude Python cache and other unnecessary files
      - /app/__pycache__
      - /app/.git
      - /app/venv
      - /app/.venv
    
    # Privileged mode for serial access
    privileged: true
    
    # Network mode
    network_mode: bridge
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Keep container running for development
    tty: true
    stdin_open: true

# Development database for testing
  postgres-dev:
    image: postgres:15-alpine
    container_name: arduino-sensor-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: sensor_data_dev
      POSTGRES_USER: sensor_dev
      POSTGRES_PASSWORD: sensor_dev_123
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

# Development Redis for caching
  redis-dev:
    image: redis:7-alpine
    container_name: arduino-sensor-redis-dev
    restart: unless-stopped
    volumes:
      - redis_dev_data:/data
    ports:
      - "6380:6379"

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  default:
    name: arduino-sensor-network-dev
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=debug

[program:flask-server-dev]
command=python -m flask run --host=0.0.0.0 --port=5000 --reload
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/flask-dev-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=FLASK_ENV=development,FLASK_DEBUG=1,PYTHONPATH=/app

[program:serial-listener-dev]
command=python serial_listener.py
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/serial-dev-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONPATH=/app
# Delay start to ensure Flask is ready
startsecs=10
# More lenient restart policy for development
startretries=10
exitcodes=0,1,2

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
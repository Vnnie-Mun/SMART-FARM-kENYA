[supervisord]
nodaemon=true
user=appuser
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[program:flask-server]
command=python app.py
directory=/app
user=appuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/flask-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=FLASK_ENV=production,PYTHONPATH=/app

[program:serial-listener]
command=python serial_listener.py
directory=/app
user=appuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/serial-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONPATH=/app
# Delay start to ensure Flask is ready
startsecs=10
# Restart policy for serial connection issues
startretries=3
exitcodes=0,2

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700
chown=appuser:appuser

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface